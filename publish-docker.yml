# .github/workflows/publish-docker.yml
#
# Builds the Exec-Skills governance image and publishes it to GitHub
# Container Registry (ghcr.io) whenever main is updated or a version
# tag is pushed.
#
# After the first successful run, the image will appear under the
# repo's "Packages" section (right sidebar on the repo homepage) and
# be pullable as:
#   docker pull ghcr.io/yadavranjan2023/exec-skills:latest
#
# No extra secrets to configure — GITHUB_TOKEN is provided
# automatically and scoped by the "permissions" block below.

name: Publish Docker image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "_base/**"
      - "ceo/**"
      - "cto/**"
      - "cpo/**"
      - "clo/**"
      - "scripts/validate_skill.py"
      - ".github/workflows/publish-docker.yml"
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sanity-check the pushed image
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
